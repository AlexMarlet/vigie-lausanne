name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: node core/test-core.js
      - id: pages
        uses: actions/configure-pages@v6
      - name: Construction du site
        run: python3 tools/build_app.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          VIGIE_CONTACT: ${{ vars.VIGIE_CONTACT }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Vérification de la base Supabase (lecture seule)
        continue-on-error: true
        run: python3 tools/check_supabase.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Navigateur de test
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Test du site en ligne (lecture seule)
        run: python3 tools/smoke_test.py "${{ needs.deploy.outputs.page_url }}"
