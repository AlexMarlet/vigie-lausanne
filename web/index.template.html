<script>
/*@DATA@*/
</script>
<script>
(function () {
  "use strict";
  const C = window.VigieCore, D = window.VIGIE_DATA;

  // ---------- configuration ----------
  // Injectée au build (variables SUPABASE_URL et SUPABASE_KEY, voir README). Sans elle, l'app garde les
  // signalements sur l'appareil. La clé est la clé « publishable », faite pour être publique.
  const CONFIG = window.VIGIE_CONFIG || {};
  const IN_CLAUDE = !!(window.claude && typeof window.claude.use === "function");   // aperçu publié dans Claude
  const MODE = IN_CLAUDE ? "claude" : (CONFIG.supabaseUrl && CONFIG.supabaseKey ? "supabase" : "local");
  const SHOW_DEMO = MODE !== "supabase" || /[?&]demo\b/.test(location.search);
  const REDUCED_MOTION = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  // ---------- petites aides ----------
  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  };
  const esc = (t) => String(t).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const store = (() => { try { const k = "vigie.t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return localStorage; } catch (e) { return null; } })();
  const pref = {
    get(k, d) { try { const v = store && store.getItem("vigie." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { if (store) store.setItem("vigie." + k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
  };
  const DEVICE = pref.get("device", null) || (() => {
    const id = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, "0")).join("");
    pref.set("device", id); return id;
  })();
  const ago = (t, now) => {
    const m = Math.max(0, Math.round((now - t) / 60000));
    if (m < 1) return "à l'instant";
    if (m < 60) return "il y a " + m + " min";
    const h = Math.floor(m / 60), r = m % 60;
    return "il y a " + h + " h" + (r ? " " + String(r).padStart(2, "0") : "");
  };
  const clock = (t) => new Date(t).toLocaleTimeString("fr-CH", { hour: "2-digit", minute: "2-digit" });
  const SUB_LABEL = { retard: "Retard", panne: "Panne", deviation: "Déviation", accident: "Accident", bonde: "Bondé", autre: "Autre" };
  const KIND_LABEL = { controle: "Contrôleurs", perturbation: "Perturbation", fin: "Plus là", question: "Question" };
  const LINE_RE = /^[A-Za-z0-9-]{1,12}$/;

  // ---------- données ----------
  // Arrêts et lignes : horaire officiel (tools/reseau.json) ; sens = terminus ; ordre des arrêts dans chaque sens.
  const STOPS = D.stops, byId = new Map(STOPS.map((s) => [s.id, s])), gaz = C.buildGazetteer(STOPS);
  const NET = C.buildNetwork(D.lines || []);
  for (const s of STOPS) s._n = [s.name, s.short].concat(s.alias || []).filter(Boolean).map(C.normalize);
  const state = {
    live: [], local: [], demo: [], demoFeed: [],
    demoOn: SHOW_DEMO && pref.get("demo", true),
    filters: Object.assign({ controle: true, perturbation: true, estimation: true }, pref.get("filters", {})),
    backend: "local", canWrite: null, db: null, sb: null,
    sheet: null, clusters: [],
    rates: C.learnRates([]), ratesRows: [], proj: { stops: [], trails: [] },
  };

  function badge(line) { return el("span", { class: "badge" + (/^M\d$/.test(line) ? " " + line : ""), text: line }); }
  function stopName(id) { const s = byId.get(id); return s ? s.name : id; }
  function dirLabel(line, dirId) { const d = line && dirId ? C.dirById(NET, line, dirId) : null; return d ? d.label : null; }
  function lineDesc(line, dirId) { const l = dirLabel(line, dirId); return line ? "ligne " + line + (l ? " → " + l : "") : ""; }

  function validLive(r) {
    return r && (r.kind === "controle" || r.kind === "perturbation" || r.kind === "fin")
      && typeof r.stopId === "string" && byId.has(r.stopId)
      && typeof r.at === "number" && isFinite(r.at)
      && (r.line == null || (typeof r.line === "string" && LINE_RE.test(r.line)))
      && (r.dir == null || (typeof r.dir === "string" && r.dir.length <= 80))
      && (r.sub == null || Object.prototype.hasOwnProperty.call(SUB_LABEL, r.sub))
      && (r.of == null || r.of === "controle" || r.of === "perturbation");
  }

  // ---------- démo : messages Telegram fictifs ----------
  // [minutes, message, arrêt attendu] — un message dont l'arrêt n'est pas dans la liste est omis
  const DEMO_MSGS = [
    [1, "🚨 Contrôleurs au Flon direction Ouchy", "flon"],
    [3, "4 contrôleurs M2 Flon, quai direction Croisettes", "flon"],
    [5, "Bus 21 contrôle Blécherette", "blecherette"],
    [6, "Contrôle à Prélaz, dans le bus", "prelaz"],
    [8, "toujours au flon les bleus", "flon"],
    [11, "M1 en panne entre Malley et Bourdonnette", "malley"],
    [14, "y a des contrôleurs à la gare ?", null],
    [17, "Schtroumpfs à Chaudron !!", "chauderon"],
    [22, "bus déviés, travaux à St-François", "stfrancois"],
    [24, "contrôle en civil à Pully gare", "pully"],
    [27, "Contrôle en civil EPFL quai direction Renens", "epfl"],
    [29, "ils sont partis de l'EPFL", "epfl"],
    [33, "contrôleurs Sallaz", "sallaz"],
    [35, "confirmé à la Sallaz, 3 agents", "sallaz"],
    [41, "2 bleus à bourdonnette", "bourdonnette"],
    [52, "bus bondé à Georgette, impossible de monter", "georgette"],
    [64, "bonjour, c'est quoi le prix d'un billet zone 11-12 ?", null],
    [80, "contrôleurs vennes", "vennes"],
  ];
  const DEMO_APP = [
    { min: 2, kind: "controle", stopId: "flon", line: "M2", dir: "croisettes" },
    { min: 7, kind: "controle", stopId: "prelaz", line: "9" },
    { min: 12, kind: "perturbation", stopId: "malley", line: "M1", sub: "panne" },
    { min: 10, kind: "controle", stopId: "riponne", line: "M2", dir: "ouchy" },
  ];
  // tendances fictives de la démo (sur le site, elles viennent de la base)
  const DEMO_TRENDS = [
    { line: "M2", direction: "croisettes", paires: 14, arrets: 25, minutes: 61 },
    { line: "M2", direction: "ouchy", paires: 9, arrets: 16, minutes: 37 },
    { line: "M1", direction: "renens", paires: 11, arrets: 13, minutes: 44 },
    { line: "9", direction: "lutry", paires: 4, arrets: 5, minutes: 21 },
  ];
  function withDirection(r) {
    // « … direction X » : ligne et sens déduits du réseau quand c'est sans ambiguïté
    const s = byId.get(r.stopId);
    const rd = r.dirStopId && s ? C.resolveDirection(NET, s.lines, r.stopId, r.dirStopId, r.line) : null;
    return Object.assign(r, { line: r.line || (rd && rd.line) || null, dir: r.dir || (rd && rd.dir) || null });
  }
  function buildDemo() {
    const t0 = Date.now();
    state.demoFeed = DEMO_MSGS.filter((m) => m[2] === null || byId.has(m[2]))
      .map(([min, text], i) => ({ id: "dm" + i, at: t0 - min * 60000, text, p: C.parseMessage(text, gaz) }));
    state.demo = state.demoFeed.filter((m) => m.p.usable).map((m) => withDirection({
      id: m.id, kind: m.p.kind, sub: m.p.sub, of: m.p.of, stopId: m.p.stopId, line: m.p.line, dirStopId: m.p.dirStopId,
      src: "telegram", at: m.at, demo: true,
    })).concat(DEMO_APP.filter((a) => byId.has(a.stopId)).map((a, i) => ({
      id: "da" + i, kind: a.kind, sub: a.sub || null, stopId: a.stopId, line: a.line, dir: a.dir || null,
      src: "app", by: "demo-" + i, at: t0 - a.min * 60000, demo: true,
    })));
  }

  // ---------- fond de carte (site en ligne) ----------
  // « simple » : fond vectoriel épuré (OpenFreeMap, gratuit, sans clé ni limite), sombre avec le thème sombre.
  // « reseau » : plan de toutes les lignes (ÖPNVKarte). « suisse » : fond clair swisstopo (comparaison, via ?fond=suisse).
  // Choix : paramètre ?fond=, sinon préférence enregistrée, sinon « simple ».
  const FONDS = {
    simple: { label: "Épuré", light: "https://tiles.openfreemap.org/styles/positron", dark: "https://tiles.openfreemap.org/styles/dark" },
    suisse: { label: "swisstopo", light: "https://vectortiles.geo.admin.ch/styles/ch.swisstopo.lightbasemap.vt/style.json" },
    reseau: { label: "Lignes TP", tiles: "https://tileserver.memomaps.de/tilegen/{z}/{x}/{y}.png",
              attribution: 'Carte <a href="https://memomaps.de/">memomaps.de</a> CC-BY-SA · données © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' },
  };
  // couches retirées du fond épuré : petites rues, sentiers, numéros de routes, aéroport, sens uniques, frontières
  const FOND_HIDE = new Set(["highway-name-path", "highway-name-minor", "highway_name_other", "highway_name_motorway",
    "highway-shield-non-us", "highway-shield-us-interstate", "road_shield_us", "airport", "road_oneway", "road_oneway_opposite",
    "highway_path", "boundary_3", "boundary_2", "boundary_disputed", "boundary_state", "boundary_country_z0-4", "boundary_country_z5-"]);
  // retouches de couleur : lac bleuté, autoroute moins massive en sombre, noms de villes plus discrets
  const FOND_PAINT = {
    water: { light: { "fill-color": "#c6d9e4" }, dark: { "fill-color": "#14212b" } },
    highway_motorway_inner: { dark: { "line-color": "#262b30" } },
    highway_major_inner: { dark: { "line-color": "#1f2428" } },
    label_city: { light: { "text-color": "#4a5258" } },
    label_town: { light: { "text-color": "#4a5258" } },
    label_village: { light: { "text-color": "#4a5258" } },
  };
  const FOND_PARAM = (location.search.match(/[?&]fond=([a-z]+)/) || [])[1];
  let fondName = FONDS[FOND_PARAM] ? FOND_PARAM : (FONDS[pref.get("fond", "")] ? pref.get("fond", "") : "simple");
  let baseLayer = null, glLoading = null, fondSeq = 0;
  function isDark() {
    const t = document.documentElement.getAttribute("data-theme");
    if (t === "dark" || t === "light") return t === "dark";
    return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function hasWebGL() {
    try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (e) { return false; }
  }
  function loadScript(src) {
    return new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = ko; document.head.append(sc); });
  }
  function loadGL() {
    if (L.maplibreGL) return Promise.resolve();
    if (!glLoading) {
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "__MAPLIBRE_CSS__"; document.head.append(css);
      glLoading = loadScript("__MAPLIBRE_JS__").then(() => loadScript("__MAPLIBRE_LEAFLET_JS__"));
    }
    return glLoading;
  }
  async function setFond(name) {
    const seq = ++fondSeq;
    let f = FONDS[name] || FONDS.simple;
    let style = null;
    document.documentElement.dataset.fond = "chargement";
    if (!f.tiles) {
      try {
        if (!hasWebGL()) throw new Error("webgl");
        await loadGL();
        const variant = isDark() && f.dark ? "dark" : "light";
        style = await (await fetch(f[variant])).json();
        style.layers = style.layers.filter((l) => !FOND_HIDE.has(l.id));
        for (const l of style.layers) {
          const tweak = FOND_PAINT[l.id] && FOND_PAINT[l.id][variant];
          const prefix = l.type === "symbol" ? "text-" : l.type + "-";
          if (tweak && Object.keys(tweak).every((k) => k.startsWith(prefix))) l.paint = Object.assign({}, l.paint, tweak);
        }
      } catch (e) { name = "reseau"; f = FONDS.reseau; }   // vieux téléphone ou réseau : plan raster
    }
    if (seq !== fondSeq) return;                         // un autre choix a été fait entre-temps
    fondName = name;
    if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }
    if (f.tiles) {
      baseLayer = L.tileLayer(f.tiles, { maxZoom: 18, attribution: f.attribution }).addTo(map);
      baseLayer.once("load", () => { document.documentElement.dataset.fond = "ok"; });
    } else {
      baseLayer = L.maplibreGL({ style }).addTo(map);
      baseLayer.getMaplibreMap().once("idle", () => { document.documentElement.dataset.fond = "ok"; });
    }
  }

  // ---------- carte ----------
  const map = L.map("map", {
    zoomControl: false, attributionControl: true, minZoom: 11, maxZoom: 18, zoomSnap: 0.5,
    maxBounds: [[46.43, 6.40], [46.67, 6.88]], maxBoundsViscosity: 0.8,
  });
  map.attributionControl.setPrefix(false);
  const R = L.svg({ padding: 0.5 });

  if (IN_CLAUDE) {
    // démo dans Claude : fond vectoriel embarqué (les tuiles externes sont bloquées ici)
    for (const ring of D.basemap.lake) L.polygon(ring, { className: "lake", interactive: false, renderer: R }).addTo(map);
    for (const c of D.basemap.communes) {
      for (const ring of c.rings) L.polygon(ring, { className: "commune", interactive: false, renderer: R }).addTo(map);
      if (c.showLabel === false) continue;
      L.marker(c.labelAt || c.label, { interactive: false, keyboard: false,
        icon: L.divIcon({ className: "", html: '<div class="commune-lbl">' + esc(c.name) + "</div>", iconSize: [0, 0] }) }).addTo(map);
    }
    map.attributionControl.addAttribution("Fond © swisstopo / OFS (swiss-maps) · positions des arrêts : voir légende");
  } else {
    setFond(fondName);
    if (window.matchMedia) {                              // le fond suit le thème clair / sombre du téléphone
      const mq = matchMedia("(prefers-color-scheme: dark)");
      if (mq.addEventListener) mq.addEventListener("change", () => { if (FONDS[fondName].dark) setFond(fondName); });
    }
  }

  // lignes M1 et M2, par-dessus le fond
  for (const [line, ids] of Object.entries(D.metro)) {
    const pts = ids.map((id) => byId.get(id)).filter(Boolean).map((s) => [s.lat, s.lon]);
    L.polyline(pts, { className: "casing", interactive: false, renderer: R }).addTo(map);
    L.polyline(pts, { className: "line-" + line, interactive: false, renderer: R }).addTo(map);
  }

  const stopLayer = L.layerGroup().addTo(map);
  const stopMarkers = new Map();
  for (const s of STOPS) s._metro = !!(s.lines && s.lines.some((l) => /^M\d$/.test(l)));
  function drawStops() {
    stopLayer.clearLayers(); stopMarkers.clear(); shownLabels.clear();
    for (const s of STOPS) {
      const m = L.circleMarker([s.lat, s.lon], {
        radius: s._metro ? 5 : 4, className: (s._metro ? "stop-metro" : "stop-bus") + (s.major ? " stop-major" : ""), renderer: R, bubblingMouseEvents: false,
      }).addTo(stopLayer);
      // étiquettes permanentes : métro et grands arrêts ; les autres, seulement de près (voir labels())
      if (s._metro || s.major) m.bindTooltip(esc(s.short || s.name), { permanent: true, direction: "right", className: "lbl " + (s._metro ? "lbl-metro" : "lbl-bus") + (s.major ? " lbl-major" : ""), interactive: false });
      m.on("click", () => onStopTap(s.id));
      stopMarkers.set(s.id, m);
    }
  }
  // plusieurs centaines d'arrêts : les étiquettes des petits arrêts n'existent que dans la zone visible, à partir du zoom 15
  const shownLabels = new Set();
  function labels() {
    const want = new Set();
    if (map.getZoom() >= 15) {
      const b = map.getBounds().pad(0.3);
      for (const s of STOPS) if (!s._metro && !s.major && b.contains([s.lat, s.lon])) want.add(s.id);
    }
    for (const id of shownLabels) if (!want.has(id)) { stopMarkers.get(id).unbindTooltip(); shownLabels.delete(id); }
    for (const id of want) {
      if (shownLabels.has(id)) continue;
      const s = byId.get(id);
      stopMarkers.get(id).bindTooltip(esc(s.short || s.name), { permanent: true, direction: "right", className: "lbl lbl-bus", interactive: false });
      shownLabels.add(id);
    }
  }
  drawStops();

  function zoomClasses() {
    const z = map.getZoom(), c = map.getContainer().classList;
    c.toggle("zlt125", z < 12.5); c.toggle("zlt135", z < 13.5); c.toggle("zlt14", z < 14); c.toggle("zlt15", z < 15); c.toggle("zge13", z >= 13);
  }
  map.on("zoomend", zoomClasses);
  map.on("zoomend moveend", labels);

  function fitAll(animate) {
    // Grand Lausanne (le réseau va jusqu'à Echallens et Cossonay : on recentre sur le cœur)
    map.fitBounds([[46.502, 6.555], [46.556, 6.705]], { paddingTopLeft: [12, 120], paddingBottomRight: [12, 96], animate: !!animate });
  }
  function homeView() {
    map.fitBounds([[46.506, 6.598], [46.544, 6.662]], { paddingTopLeft: [4, 120], paddingBottomRight: [4, 96], maxZoom: 14, animate: false });
  }
  homeView();
  zoomClasses();
  labels();

  // ---------- position estimée ----------
  // Trajet probable depuis chaque contrôle signalé avec sa ligne, et anneaux sur les arrêts de la zone la plus
  // probable (au moins la moitié du maximum du trajet). Calcul : C.project (vigie-core.js).
  const estLayer = L.layerGroup().addTo(map);
  function trendRows() { return state.ratesRows.length ? state.ratesRows : (state.demoOn ? DEMO_TRENDS : []); }
  function refreshRates() { state.rates = C.learnRates(trendRows()); }
  function renderEstimates(now) {
    estLayer.clearLayers();
    state.proj = { stops: [], trails: [] };
    if (!state.filters.controle || !state.filters.estimation) return;
    state.proj = C.project(allReports(), NET, state.rates, now);
    const real = new Set(state.clusters.filter((c) => c.kind === "controle").map((c) => c.stopId));
    for (const t of state.proj.trails) {
      const top = t.p[t.peak], strength = Math.min(1, 0.35 + top * 5);
      for (let i = 1; i < t.stops.length; i++) {
        const a = byId.get(t.stops[i - 1]), b = byId.get(t.stops[i]);
        if (!a || !b) continue;
        const o = strength * Math.min(1, 0.2 + 0.8 * t.p[i] / top);
        const seg = [[a.lat, a.lon], [b.lat, b.lon]];
        L.polyline(seg, { className: "trail-base", opacity: o * 0.14, interactive: false, renderer: R }).addTo(estLayer);
        L.polyline(seg, { className: "trail", opacity: o, interactive: false, renderer: R }).addTo(estLayer);
      }
    }
    for (const e of state.proj.stops) {
      if (real.has(e.stopId) || e.rel < 0.5) continue;
      const s = byId.get(e.stopId);
      if (!s) continue;
      const d = Math.round(18 + 20 * Math.min(1, e.p / 0.2));
      const m = L.marker([s.lat, s.lon], {
        icon: L.divIcon({ className: "gh-wrap", iconSize: [d, d], iconAnchor: [d / 2, d / 2],
          html: '<div class="gh" style="--col:' + C.colorFor(Math.min(1, e.p * 3)) + '"></div>' }),
        zIndexOffset: 500, keyboard: true, title: "Position estimée des contrôleurs · " + s.name,
      });
      m.on("click", () => openEstimate(e.stopId));
      m.addTo(estLayer);
    }
  }

  // ---------- points de signalement ----------
  const clusterLayer = L.layerGroup().addTo(map);
  const clusterMarkers = new Map();
  function iconFor(cl, now) {
    const r = C.radiusFor(cl.confidence), d = r * 2;
    const fresh = now - cl.lastAt < 4 * 60000 && !cl.clearedAfterLast;
    const col = C.colorFor(cl.confidence);
    const txt = cl.confidence < 0.42 ? "#2A1D00" : "#FFFFFF";
    const label = cl.kind === "perturbation" ? "!" : (cl.count > 1 ? String(cl.count) : "");
    return L.divIcon({
      className: "mk-wrap", iconSize: [d, d], iconAnchor: [d / 2, d / 2],
      html: '<div class="mk ' + (cl.kind === "perturbation" ? "p" : "c") + (fresh ? " fresh" : "") + '" style="--col:' + col + ';--txt:' + txt + '">' +
            '<span class="halo"></span><span class="core"><span>' + label + "</span></span></div>",
    });
  }
  function sig(cl, now) { return [cl.kind, C.radiusFor(cl.confidence), C.colorFor(cl.confidence), cl.count, now - cl.lastAt < 4 * 60000 && !cl.clearedAfterLast].join("|"); }

  function allReports() { return state.live.concat(state.local, state.demoOn ? state.demo : []); }

  function render() {
    const now = Date.now();
    state.clusters = C.computeClusters(allReports(), now).filter((c) => byId.has(c.stopId));
    const visible = state.clusters.filter((c) => state.filters[c.kind]);
    const keep = new Set();
    for (const cl of visible) {
      keep.add(cl.key);
      const s = byId.get(cl.stopId);
      const k = sig(cl, now);
      let m = clusterMarkers.get(cl.key);
      if (!m) {
        m = L.marker([s.lat, s.lon], { icon: iconFor(cl, now), zIndexOffset: 1000 + Math.round(cl.confidence * 1000), keyboard: true, title: (cl.kind === "controle" ? "Contrôleurs" : "Perturbation") + " · " + s.name });
        m.on("click", () => openCluster(cl.key));
        m._sig = k; m.addTo(clusterLayer); clusterMarkers.set(cl.key, m);
      } else if (m._sig !== k) {
        m.setIcon(iconFor(cl, now)); m.setZIndexOffset(1000 + Math.round(cl.confidence * 1000)); m._sig = k;
      }
    }
    for (const [key, m] of clusterMarkers) if (!keep.has(key)) { clusterLayer.removeLayer(m); clusterMarkers.delete(key); }
    renderEstimates(now);

    const nC = visible.filter((c) => c.kind === "controle").length, nP = visible.filter((c) => c.kind === "perturbation").length;
    const parts = [];
    if (state.filters.controle) parts.push(nC + " contrôle" + (nC > 1 ? "s" : ""));
    if (state.filters.perturbation) parts.push(nP + " perturbation" + (nP > 1 ? "s" : ""));
    const src = state.backend === "claude" ? "en direct" : state.backend === "supabase" ? "en direct" : "sur cet appareil";
    const summary = !parts.length ? "Filtres désactivés" : (nC + nP === 0 ? "Aucun signalement en cours" : parts.join(" · "));
    $("#status").textContent = summary + " · " + (state.demoOn ? "démo" : src);
    $("#liveDot").classList.toggle("off", !(state.backend === "claude" || state.backend === "supabase"));
    $("#feedCount").textContent = String(feedItems().length);
    if (state.sheet && state.sheet.refresh) state.sheet.refresh();
  }

  // ---------- feuille coulissante ----------
  const sheetEl = $("#sheet"), sheetBody = $("#sheetBody"), sheetTitle = $("#sheetTitle");
  let lastFocus = null, closeTimer = null;
  function openSheet(kind, title, build, refresh) {
    clearTimeout(closeTimer);
    lastFocus = lastFocus || document.activeElement;
    state.sheet = { kind, refresh: refresh || null };
    sheetTitle.textContent = title;
    sheetBody.replaceChildren(build());
    sheetEl.hidden = false; sheetEl.classList.remove("closing");
    requestAnimationFrame(() => sheetTitle.focus({ preventScroll: true }));
  }
  function closeSheet() {
    if (sheetEl.hidden) return;
    state.sheet = null; picked.setPicked(null);
    sheetEl.classList.add("closing");
    closeTimer = setTimeout(() => { sheetEl.hidden = true; sheetBody.replaceChildren(); }, 260);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    lastFocus = null;
  }
  $("#sheetClose").addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  map.on("click", () => { if (state.sheet && state.sheet.kind !== "report") closeSheet(); });

  function focusStop(id) {
    const s = byId.get(id); if (!s) return;
    const z = Math.max(map.getZoom(), 14.5);
    const sheetH = sheetEl.hidden ? 0 : sheetEl.offsetHeight;
    const p = map.project([s.lat, s.lon], z).add([0, Math.max(0, (sheetH - 120) / 2)]);
    if (REDUCED_MOTION) map.setView(map.unproject(p, z), z, { animate: false });
    else map.flyTo(map.unproject(p, z), z, { duration: 0.45 });
  }

  // arrêt mis en évidence pendant le choix
  const picked = {
    id: null,
    setPicked(id) {
      if (this.id && stopMarkers.get(this.id)) stopMarkers.get(this.id).getElement()?.classList.remove("stop-picked");
      this.id = id;
      if (id && stopMarkers.get(id)) { const e = stopMarkers.get(id).getElement(); if (e) e.classList.add("stop-picked"); stopMarkers.get(id).bringToFront(); }
    },
  };

  // ---------- recherche d'arrêt ----------
  function searchStops(q) {
    const nq = C.normalize(q);
    if (!nq) return [];
    const scored = [];
    const guess = nq.length >= 4 ? C.parseMessage(q, gaz).stopId : null;   // nom mal orthographié : une seule fois
    for (const s of STOPS) {
      let best = 9;
      for (const n of s._n) {
        if (n.startsWith(nq)) best = Math.min(best, 0);
        else if (n.split(" ").some((w) => w.startsWith(nq))) best = Math.min(best, 1);
        else if (n.includes(nq)) best = Math.min(best, 2);
      }
      if (best === 9 && guess === s.id) best = 3;
      if (best < 9) scored.push([best, s]);
    }
    scored.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name, "fr"));
    return scored.slice(0, 6).map((x) => x[1]);
  }

  // ---------- formulaire de signalement ----------
  const form = { kind: "controle", sub: null, stopId: null, line: null, dir: null };
  function onStopTap(id) {
    if (state.sheet && state.sheet.kind === "report") { setFormStop(id); return; }
    openReport({ stopId: id });
  }
  let setFormStop = () => {};

  function openReport(pre) {
    Object.assign(form, { kind: "controle", sub: null, stopId: null, line: null, dir: null }, pre || {});
    openSheet("report", "Signaler", () => {
      const wrap = el("div", { class: "stack" });
      const seg = el("div", { class: "seg", role: "group", "aria-label": "Type de signalement" });
      const bK = el("button", { type: "button", "aria-pressed": "true" }, el("i", { class: "shape circle" }), "Contrôleurs");
      const bP = el("button", { type: "button", "aria-pressed": "false" }, el("i", { class: "shape diamond" }), "Perturbation");
      seg.append(bK, bP);
      const subBox = el("div", { hidden: true }, el("p", { class: "label", text: "Quel problème ?" }));
      const subChips = el("div", { class: "chips" });
      for (const [k, v] of Object.entries(SUB_LABEL)) {
        subChips.append(el("button", { type: "button", class: "opt", "aria-pressed": "false", "data-sub": k, onclick: (e) => {
          form.sub = form.sub === k ? null : k;
          subChips.querySelectorAll(".opt").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sub === form.sub)));
          sync();
        } }, v));
      }
      subBox.append(subChips);
      const setKind = (k) => {
        form.kind = k; bK.setAttribute("aria-pressed", String(k === "controle")); bP.setAttribute("aria-pressed", String(k === "perturbation"));
        subBox.hidden = k !== "perturbation"; sync();
      };
      bK.addEventListener("click", () => setKind("controle"));
      bP.addEventListener("click", () => setKind("perturbation"));

      // arrêt
      const stopBox = el("div");
      const lineBox = el("div");
      const dirBox = el("div", { hidden: true });
      const drawStop = () => {
        stopBox.replaceChildren(el("p", { class: "label", text: "Arrêt" }));
        if (form.stopId) {
          const s = byId.get(form.stopId);
          stopBox.append(el("div", { class: "picked" },
            el("div", null, el("strong", { text: s.name })),
            el("button", { type: "button", class: "link", onclick: () => { form.stopId = null; form.line = null; form.dir = null; picked.setPicked(null); drawStop(); drawLines(); sync(); stopBox.querySelector("input")?.focus(); } }, "Changer")));
        } else {
          const input = el("input", { id: "stopSearch", class: "field", type: "search", autocomplete: "off", placeholder: "Nom de l'arrêt (ex. Chauderon)", "aria-label": "Rechercher un arrêt" });
          const list = el("div", { class: "sugg", role: "listbox" });
          const fill = () => {
            const res = searchStops(input.value);
            list.replaceChildren(...res.map((s) => el("button", { type: "button", role: "option", onclick: () => setFormStop(s.id) },
              el("span", { text: s.name }), el("span", { class: "badges" }, (s.lines || []).map(badge)))));
            if (input.value && !res.length) list.replaceChildren(el("p", { class: "hint", text: "Aucun arrêt trouvé. Essaie un autre nom ou touche l'arrêt sur la carte." }));
          };
          input.addEventListener("input", fill);
          stopBox.append(input, list, el("p", { class: "hint", text: "Ou touche un arrêt directement sur la carte." }));
          if (!IN_CLAUDE && "geolocation" in navigator) {
            stopBox.append(el("button", { type: "button", class: "link", onclick: locate }, "Arrêt le plus proche de moi"));
          }
        }
      };
      // ligne puis sens : toutes les lignes de l'arrêt, puis les terminus atteignables depuis cet arrêt
      const drawLines = () => {
        const s = form.stopId && byId.get(form.stopId);
        lineBox.hidden = !s;
        lineBox.replaceChildren(el("p", { class: "label", text: "Ligne (facultatif)" }));
        if (s) {
          const row = el("div", { class: "chips", role: "group", "aria-label": "Ligne" });
          const h = new Date().getHours(), night = h >= 22 || h < 6;   // lignes de nuit (N1…) : proposées la nuit
          for (const l of (s.lines || []).filter((x) => night || !/^N\d/.test(x) || x === form.line)) {
            row.append(el("button", { type: "button", class: "opt", "aria-pressed": String(form.line === l), "data-line": l,
              onclick: () => { form.line = form.line === l ? null : l; form.dir = null; drawLines(); } }, l));
          }
          lineBox.append(row);
        }
        drawDirs();
      };
      const drawDirs = () => {
        const ways = form.stopId && form.line ? C.directionsAt(NET, form.line, form.stopId) : [];
        dirBox.hidden = !ways.length;
        dirBox.replaceChildren(el("p", { class: "label", text: "Sens (facultatif)" }));
        if (!ways.length) return;
        const row = el("div", { class: "chips", role: "group", "aria-label": "Sens" });
        for (const { dir } of ways) {
          row.append(el("button", { type: "button", class: "opt", "aria-pressed": String(form.dir === dir.id), "data-dir": dir.id,
            onclick: () => { form.dir = form.dir === dir.id ? null : dir.id; drawDirs(); } }, "→ " + dir.label));
        }
        dirBox.append(row, el("p", { class: "hint", text: "Avec la ligne et le sens, la carte estime où ils seront dans les prochaines minutes." }));
      };
      setFormStop = (id) => {
        const before = form.line;
        form.stopId = id;
        const s = byId.get(id);
        if (form.line && !(s && (s.lines || []).includes(form.line))) form.line = null;
        if (s && s.lines && s.lines.length === 1 && !form.line) form.line = s.lines[0];
        // le sens se rapporte à une ligne : il ne passe jamais d'une ligne à l'autre (terminus partagés)
        if (form.line !== before || (form.dir && !C.directionsAt(NET, form.line, id).some((w) => w.dir.id === form.dir))) form.dir = null;
        picked.setPicked(id); drawStop(); drawLines(); sync(); focusStop(id);
      };

      const privacy = el("p", { class: "privacy" });
      privacy.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
      privacy.append("Seuls le lieu, la ligne, le sens et l'heure sont partagés. Pas de photo, de pseudo ni de description des agents.");

      const send = el("button", { type: "button", class: "primary", disabled: true }, "Envoyer le signalement");
      const why = el("p", { class: "hint", hidden: true });
      const sync = () => {
        send.disabled = !form.stopId || state.canWrite === false;
        why.hidden = state.canWrite !== false;
        why.textContent = "Cette page est en lecture seule pour toi : demande l'accès « Contributeur » pour pouvoir signaler.";
      };
      send.addEventListener("click", async () => {
        if (!form.stopId) return;
        send.disabled = true;
        const ok = await submit({ kind: form.kind, sub: form.kind === "perturbation" ? form.sub : null, stopId: form.stopId, line: form.line, dir: form.dir });
        if (ok) { const id = form.stopId; closeSheet(); setTimeout(() => focusStop(id), 280); } else sync();
      });

      wrap.append(el("div", null, el("p", { class: "label", text: "Qu'as-tu vu ?" }), seg), subBox, stopBox, lineBox, dirBox, privacy, el("div", null, send, why));
      drawStop(); drawLines(); setKind(form.kind);
      if (form.stopId) { picked.setPicked(form.stopId); setTimeout(() => focusStop(form.stopId), 60); }
      return wrap;
    });
  }

  function locate() {
    navigator.geolocation.getCurrentPosition((pos) => {
      const { latitude: la, longitude: lo } = pos.coords;
      let best = null, bd = Infinity;
      for (const s of STOPS) { const d = (s.lat - la) ** 2 + ((s.lon - lo) * Math.cos(la * Math.PI / 180)) ** 2; if (d < bd) { bd = d; best = s; } }
      if (best) setFormStop(best.id);
    }, () => toast("Position indisponible : choisis l'arrêt dans la liste."), { enableHighAccuracy: true, timeout: 8000 });
  }

  // ---------- envoi ----------
  async function submit(r) {
    // sens : identifiant du terminus ; rang de l'arrêt dans ce sens (sert à apprendre la vitesse des contrôles)
    const way = r.line && r.dir ? C.directionsAt(NET, r.line, r.stopId).find((w) => w.dir.id === r.dir) : null;
    const doc = { kind: r.kind, sub: r.sub || null, of: r.of || null, stopId: r.stopId, line: r.line || null,
      dir: way ? r.dir : null, seq: way ? way.seq : null, src: "app", by: DEVICE, at: Date.now() };
    if (state.backend === "claude" && state.db) {
      try {
        await state.db.collection("reports").add(doc);
        toast(r.kind === "fin" ? "Merci, c'est noté." : "Signalement envoyé");
        prune();
        return true;
      } catch (e) {
        if (e && e.code === "invalid_argument") { state.canWrite = false; toast("Lecture seule : ton signalement n'a pas été partagé."); return false; }
        if (e && e.code === "quota_exceeded") { toast("La base est pleine : supprime d'anciens signalements."); return false; }
      }
    } else if (state.backend === "supabase" && state.sb) {
      const args = { p_kind: doc.kind, p_stop_id: doc.stopId, p_device: DEVICE, p_line: doc.line, p_sub: doc.sub, p_of_kind: doc.of };
      let { error } = await state.sb.rpc("signaler", Object.assign({ p_direction: doc.dir, p_seq: doc.seq }, args));
      if (error && /PGRST202|Could not find the function/i.test((error.code || "") + " " + (error.message || ""))) {
        ({ error } = await state.sb.rpc("signaler", args));    // base pas encore mise à jour (schema.sql) : sans le sens
      }
      if (!error) { toast(r.kind === "fin" ? "Merci, c'est noté." : "Signalement envoyé"); if (state.pull) state.pull(); return true; }
      if (/Trop de signalements/.test(error.message || "")) { toast("Trop de signalements d'affilée : réessaie dans quelques minutes."); return false; }
      toast("Envoi impossible pour l'instant : gardé sur cet appareil.");
    }
    state.local.push(Object.assign({ id: "loc" + Date.now() }, doc));
    render();
    if (state.backend === "local") toast("Ajouté sur cet appareil (pas de partage dans ce mode)");
    return true;
  }

  let pruned = false;
  async function prune() {
    if (pruned || !state.db) return; pruned = true;
    try {
      const old = await state.db.collection("reports").where("at", "<", Date.now() - 24 * 3600e3).limit(25).get();
      for (const d of old.docs) await state.db.doc("reports/" + d.id).delete();
    } catch (e) { /* ménage best-effort */ }
  }

  // ---------- fiche d'un point ----------
  function openCluster(key) {
    const first = state.clusters.find((c) => c.key === key); if (!first) return;
    picked.setPicked(null);
    const build = () => {
      const now = Date.now();
      const cl = state.clusters.find((c) => c.key === key);
      const box = el("div", { class: "stack" });
      if (!cl) { box.append(el("p", { class: "facts", text: "Ce signalement a expiré : plus assez récent pour être affiché." })); return box; }
      const s = byId.get(cl.stopId);
      const isP = cl.kind === "perturbation";
      const head = el("div", { class: "k-head" }, el("i", { class: "shape " + (isP ? "diamond" : "circle"), style: "color:" + C.colorFor(cl.confidence) }),
        isP ? "Perturbation" + (cl.subs.length ? " · " + cl.subs.map((x) => SUB_LABEL[x] || x).join(", ") : "") : "Contrôleurs signalés");
      const lines = cl.lines.length ? cl.lines : [];
      const title = el("div", null, head, el("div", { class: "k-stop", text: s.name }), el("span", { class: "badges" }, lines.map(badge)));
      const pct = Math.round(cl.confidence * 100);
      const conf = el("div", { class: "conf", role: "img", "aria-label": "Confiance " + cl.level + ", " + pct + " %" },
        el("span", { class: "conf-level", style: "color:" + C.colorFor(cl.confidence), text: cl.level }),
        el("span", { class: "conf-pct", text: pct + " % de confiance" }),
        el("div", { class: "bar" }, el("i", { style: "left:" + pct + "%" })),
        el("div", { class: "bar-scale" }, el("span", { text: "faible" }), el("span", { text: "moyenne" }), el("span", { text: "forte" })));
      const srcTxt = [];
      if (cl.src.telegram) srcTxt.push(cl.src.telegram + " Telegram");
      if (cl.src.app) srcTxt.push(cl.src.app + " app");
      const facts = el("p", { class: "facts" }, el("strong", { text: cl.count + " signalement" + (cl.count > 1 ? "s" : "") }),
        " · le dernier " + ago(cl.lastAt, now) + (srcTxt.length ? " · " + srcTxt.join(", ") : ""));
      box.append(title, conf, facts);
      if (cl.lastClear) box.append(el("div", { class: "cleared" }, "Départ signalé " + ago(cl.lastClear, now) + " : les signalements plus anciens comptent moins."));
      const tl = el("ul", { class: "tl", "aria-label": "Détail des signalements" });
      for (const r of cl.reports.slice(0, 6)) {
        tl.append(el("li", null, el("span", { class: "t", text: ago(r.at, now).replace("il y a ", "") }),
          el("span", null, (r.src === "telegram" ? "Telegram" : "App") + (r.line ? " · " + lineDesc(r.line, r.dir) : "")),
          el("span", { class: "w", title: "Poids actuel" }, el("i", { style: "width:" + Math.round(r.w * 100 / 0.6) + "%;background:" + C.colorFor(r.w / 0.6) }))));
      }
      box.append(el("div", null, el("p", { class: "label", text: "Poids de chaque signalement" }), tl));
      const withLine = cl.reports.find((x) => x.line) || {};
      const row = el("div", { class: "row" },
        el("button", { type: "button", class: "secondary", onclick: async () => { if (await submit({ kind: cl.kind, sub: cl.subs[0] || null, stopId: cl.stopId, line: withLine.line || null, dir: withLine.dir || null })) render(); } }, isP ? "Toujours en cours" : "Toujours là"),
        el("button", { type: "button", class: "secondary", onclick: async () => { if (await submit({ kind: "fin", of: cl.kind, stopId: cl.stopId, line: null })) render(); } }, isP ? "C'est rétabli" : "Plus là"));
      box.append(row, el("p", { class: "note", text: "La confiance baisse de moitié toutes les " + C.CFG[cl.kind].half + " min sans nouveau signalement." }));
      return box;
    };
    openSheet("cluster", first.kind === "perturbation" ? "Perturbation" : "Contrôle", build, () => sheetBody.replaceChildren(build()));
    focusStop(first.stopId);
  }

  // ---------- fiche d'une position estimée ----------
  function speedText(line) {
    const demo = !state.ratesRows.length && state.demoOn ? ", démo" : "";
    const l = state.rates.lines.get(line), rate = C.rateFor(state.rates, line), n = state.rates.net.pairs;
    if (l) return C.paceText(rate) + " (appris sur " + l.pairs + " observation" + (l.pairs > 1 ? "s" : "") + demo + ")";
    if (n) return C.paceText(rate) + " (moyenne de toutes les lignes, " + n + " observation" + (n > 1 ? "s" : "") + demo + ")";
    return C.paceText(rate) + " (hypothèse de départ, en attendant assez de signalements)";
  }
  function openEstimate(stopId) {
    picked.setPicked(null);
    const build = () => {
      const now = Date.now();
      const box = el("div", { class: "stack" });
      const e = state.proj.stops.find((x) => x.stopId === stopId);
      if (!e) { box.append(el("p", { class: "facts", text: "Cette estimation n'est plus d'actualité : le signalement est trop ancien ou a été démenti." })); return box; }
      const s = byId.get(stopId), t = state.proj.trails[e.trail];
      const zone = t ? [t.stops[t.zone[0]], t.stops[t.zone[1]]].map(stopName) : [];
      const pct = Math.max(1, Math.round(e.p * 100));
      const col = C.colorFor(Math.min(1, e.p * 3));
      box.append(...[
        el("div", null,
          el("div", { class: "k-head" }, el("i", { class: "shape circle", style: "background:none;border:2px dashed " + col + ";box-sizing:border-box" }), "Position estimée des contrôleurs"),
          el("div", { class: "k-stop", text: s.name }), el("span", { class: "badges" }, badge(e.line))),
        el("div", { class: "est" }, el("strong", { text: "≈ " + pct + " %" }),
          el("span", { class: "facts", text: "de chances qu'ils soient à cet arrêt en ce moment" })),
        el("p", { class: "facts" }, "Signalés à ", el("strong", { text: stopName(e.from) }), " " + ago(e.at, now) + ", " + lineDesc(e.line, e.dirGiven ? e.dir : null) + (e.dirGiven ? "" : " (sens non précisé)") + ". ",
          "Sur cette ligne, les contrôleurs avancent " + speedText(e.line) + "."),
        zone.length ? el("p", { class: "facts" }, "Zone la plus probable maintenant : ", el("strong", { text: zone[0] === zone[1] ? zone[0] : zone[0] + " – " + zone[1] }), ".") : null,
        el("p", { class: "note", text: "C'est une estimation : plus l'arrêt est loin et le signalement ancien, plus c'est incertain, car ils ont pu changer de ligne, faire demi-tour ou terminer leur contrôle." + (e.dirGiven ? "" : " Sens non précisé : les deux sens sont envisagés, chacun pour moitié.") }),
        el("div", { class: "row" },
          el("button", { type: "button", class: "secondary", onclick: async () => { if (await submit({ kind: "controle", stopId, line: e.line, dir: e.dir })) render(); } }, "Je les vois ici"),
          el("button", { type: "button", class: "secondary", onclick: async () => { if (await submit({ kind: "fin", of: "controle", stopId, line: null })) render(); } }, "Pas ici")),
      ].filter(Boolean));
      return box;
    };
    openSheet("estimate", "Estimation", build, () => sheetBody.replaceChildren(build()));
    focusStop(stopId);
  }

  // ---------- fil ----------
  function feedItems() {
    const items = [];
    if (state.demoOn) for (const m of state.demoFeed) items.push({ at: m.at, text: m.text, p: m.p, src: "telegram", demo: true });
    for (const r of state.live.concat(state.local)) items.push({ at: r.at, p: { kind: r.kind, sub: r.sub, of: r.of, stopId: r.stopId, line: r.line, dir: r.dir, usable: true }, src: r.src });
    return items.filter((i) => Date.now() - i.at < 3 * 3600e3).sort((a, b) => b.at - a.at);
  }
  function parseTags(p) {
    const tags = [];
    if (p.kind === "question") tags.push(el("span", { class: "tag miss", text: "question : ignorée" }));
    else {
      tags.push(el("span", { class: "tag" }, el("i", { class: "shape " + (p.kind === "perturbation" ? "diamond" : "circle"), style: "color:var(--c-mid)" }),
        p.kind === "fin" ? (p.of === "perturbation" ? "rétabli" : "plus là") : (KIND_LABEL[p.kind] + (p.sub ? " · " + SUB_LABEL[p.sub] : ""))));
      if (p.stopId) tags.push(el("span", { class: "tag", text: stopName(p.stopId) + (p.fuzzy ? " (approché)" : "") }));
      else tags.push(el("span", { class: "tag miss", text: "non localisé" }));
      if (p.line) tags.push(badge(p.line));
      if (p.dir && dirLabel(p.line, p.dir)) tags.push(el("span", { class: "tag", text: "→ " + dirLabel(p.line, p.dir) }));
      else if (p.dirStopId) tags.push(el("span", { class: "tag", text: "→ " + stopName(p.dirStopId) }));
    }
    return tags;
  }
  function openFeed() {
    const build = () => {
      const now = Date.now();
      const box = el("div", { class: "stack" });
      const out = el("div", { class: "meta", "aria-live": "polite" });
      const input = el("input", { id: "tester", class: "field", type: "text", autocomplete: "off", placeholder: "Colle un message, ex. « contrôle M1 Malley »", "aria-label": "Tester l'interprétation d'un message" });
      input.addEventListener("input", () => out.replaceChildren(...(input.value.trim() ? parseTags(C.parseMessage(input.value, gaz)) : [])));
      if (state.demoOn || IN_CLAUDE) box.append(el("div", { class: "tester" }, el("p", { class: "label", text: "Tester un message" }), input, out));
      const items = feedItems();
      box.append(el("p", { class: "hint", text: state.demoOn
        ? "Messages fictifs du groupe Telegram (démo), interprétés automatiquement. Les vrais messages arrivent via le collecteur."
        : "Derniers signalements des 3 dernières heures." }));
      if (!items.length) { box.append(el("p", { class: "facts", text: "Rien de signalé ces 3 dernières heures. Le premier signalement apparaîtra ici." })); return box; }
      const ul = el("ul", { class: "feed" });
      for (const it of items.slice(0, 60)) {
        const li = el("li", { class: it.p.usable ? "" : "dim" });
        if (it.text) li.append(el("div", { class: "msg", text: it.text }));
        li.append(el("div", { class: "meta" }, el("span", { text: clock(it.at) + " · " + (it.src === "telegram" ? "Telegram" : "App") }), parseTags(it.p)));
        ul.append(li);
      }
      box.append(ul);
      return box;
    };
    openSheet("feed", "Fil des signalements", build, null);
  }

  // ---------- légende ----------
  function openLegend() {
    openSheet("legend", "Comment lire la carte", () => {
      const box = el("div", { class: "stack" });
      const sample = (c, kind, n) => {
        const d = C.radiusFor(c) * 2;
        const w = el("div", { style: "width:" + d + "px;height:" + d + "px;position:relative" });
        w.innerHTML = '<div class="mk ' + kind + '" style="--col:' + C.colorFor(c) + ';--txt:' + (c < .42 ? "#2A1D00" : "#fff") + '"><span class="core"><span>' + (n || "") + "</span></span></div>";
        return w;
      };
      const ghost = el("div", { style: "width:28px;height:28px;justify-self:center" });
      ghost.innerHTML = '<div class="gh" style="--col:' + C.colorFor(0.35) + '"></div>';
      box.append(el("div", { class: "leg" },
        sample(0.6, "c", "3"), el("p", null, el("strong", { text: "Contrôleurs" }), " — le chiffre indique le nombre de signalements."),
        sample(0.5, "p", "!"), el("p", null, el("strong", { text: "Perturbation" }), " — panne, retard, déviation, véhicule bondé."),
        ghost, el("p", null, el("strong", { text: "Position estimée" }), " — où les contrôleurs sont probablement maintenant, d'après la ligne, le sens et le temps écoulé.")));
      box.append(el("div", null, el("p", { class: "label", text: "Taille et couleur = indice de confiance" }),
        el("div", { class: "ramp" },
          el("figure", null, sample(0.2, "c"), el("figcaption", { text: "faible" })),
          el("figure", null, sample(0.5, "c"), el("figcaption", { text: "moyenne" })),
          el("figure", null, sample(0.85, "c"), el("figcaption", { text: "forte" })))));
      box.append(el("ul", { class: "rules" },
        el("li", null, el("strong", { text: "1 message récent" }), " ≈ 45 % ; ", el("strong", { text: "3 messages en 6 min" }), " ≈ 80 %."),
        el("li", null, "La confiance ", el("strong", { text: "baisse de moitié toutes les 20 min" }), " (45 min pour une perturbation) ; un point disparaît après 2 h."),
        el("li", null, "« Plus là » réduit fortement les signalements antérieurs du même arrêt."),
        el("li", null, "Une même personne ne compte qu'une fois par arrêt."),
        el("li", null, "Avec la ligne (et le sens), un ", el("strong", { text: "trajet pointillé" }), " montre où ils ont pu aller ; plus c'est loin, plus c'est incertain : ils ont pu changer de ligne, de sens ou arrêter.")));
      // tendances apprises sur tous les signalements depuis le lancement
      const rows = [...state.rates.lines].sort((a, b) => b[1].pairs - a[1].pairs);
      const demoTrends = !state.ratesRows.length && state.demoOn;
      const trend = el("ul", { class: "trend" });
      for (const [line, x] of rows.slice(0, 12)) {
        trend.append(el("li", null, badge(line), el("span", { text: C.paceText(x.rate) }), el("span", { class: "n", text: x.pairs + " obs." })));
      }
      box.append(el("div", null, el("p", { class: "label", text: "Vitesse des contrôles, apprise" + (demoTrends ? " (démo)" : "") }),
        rows.length ? trend : el("p", { class: "facts", text: "Pas encore assez de signalements avec ligne et sens : l'app suppose " + C.paceText(1 / C.CFG.move.pace) + ", sur toutes les lignes." }),
        el("p", { class: "note", text: "Calculée sur tous les signalements depuis le lancement : deux contrôles signalés à la suite sur la même ligne, dans le même sens et à moins de 40 min d'écart donnent leur vitesse. Recalculée chaque heure ; tant qu'une ligne a peu de données, elle suit la moyenne du réseau." })));
      const reseau = STOPS.length + " arrêts et " + NET.byLine.size + " lignes tl, horaire officiel suisse (opentransportdata.swiss" + (D.meta && D.meta.period && D.meta.period[0] ? ", " + new Date(D.meta.period[0]).toLocaleDateString("fr-CH") : "") + ").";
      box.append(el("p", { class: "note", text: IN_CLAUDE
        ? "Aperçu : fond de carte simplifié. " + reseau
        : "Fond épuré : OpenFreeMap / OpenMapTiles ; plan des lignes : ÖPNVKarte (memomaps.de) ; données © contributeurs OpenStreetMap. " + reseau }));
      if (!IN_CLAUDE) {
        const fonds = el("div", { class: "chips", role: "group", "aria-label": "Fond de carte" });
        for (const key of ["simple", "reseau"]) {
          fonds.append(el("button", { type: "button", class: "opt", "aria-pressed": String(fondName === key),
            onclick: () => { pref.set("fond", key); setFond(key); fonds.querySelectorAll(".opt").forEach((b, i) => b.setAttribute("aria-pressed", String(["simple", "reseau"][i] === key))); } },
            FONDS[key].label));
        }
        box.append(el("div", null, el("p", { class: "label", text: "Fond de carte" }), fonds));
        const links = el("div", { class: "links" });
        if (canInstall()) links.append(el("button", { type: "button", class: "link", onclick: install }, "Installer l'app"));
        links.append(el("a", { href: "confidentialite.html" }, "Confidentialité"));
        if (D.meta && D.meta.repo) links.append(el("a", { href: D.meta.repo, target: "_blank", rel: "noopener" }, "Code source"));
        box.append(links);
      }
      return box;
    });
  }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }

  // ---------- boutons ----------
  $("#btnReport").addEventListener("click", () => openReport());
  $("#btnFeed").addEventListener("click", openFeed);
  $("#btnLegend").addEventListener("click", openLegend);
  $("#btnCenter").addEventListener("click", () => fitAll(true));
  document.querySelectorAll("[data-filter]").forEach((b) => {
    b.setAttribute("aria-pressed", String(!!state.filters[b.dataset.filter]));
    b.addEventListener("click", () => {
      state.filters[b.dataset.filter] = !state.filters[b.dataset.filter];
      b.setAttribute("aria-pressed", String(state.filters[b.dataset.filter]));
      pref.set("filters", state.filters); render();
    });
  });
  const chipDemo = $("#chipDemo");
  chipDemo.hidden = !SHOW_DEMO;
  const syncDemoChip = () => { chipDemo.setAttribute("aria-pressed", String(state.demoOn)); chipDemo.setAttribute("aria-label", state.demoOn ? "Démo activée : masquer les données fictives" : "Afficher la démo"); };
  chipDemo.addEventListener("click", () => { state.demoOn = !state.demoOn; pref.set("demo", state.demoOn); syncDemoChip(); refreshRates(); render(); });
  syncDemoChip();

  // ---------- installation (site uniquement) ----------
  const STANDALONE = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const UA = navigator.userAgent || "";
  const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const IS_ANDROID = /Android/i.test(UA);
  let deferredPrompt = null;
  function canInstall() { return !IN_CLAUDE && !STANDALONE && !!(deferredPrompt || IS_IOS || IS_ANDROID); }
  const installBar = $("#install");
  function hideInstall() { installBar.hidden = true; }
  function maybeShowInstall() {
    if (!canInstall() || !(IS_IOS || IS_ANDROID)) return;          // bandeau sur téléphone seulement
    if (Date.now() < pref.get("installLater", 0)) return;
    installBar.hidden = false;
  }
  function openInstallHelp() {
    openSheet("install", "Installer Vigie", () => {
      const box = el("div", { class: "stack" });
      box.append(IS_IOS
        ? el("ol", { class: "steps" },
            el("li", null, "Ouvre cette page dans ", el("strong", { text: "Safari" }), "."),
            el("li", null, "Touche ", el("strong", { text: "Partager" }), " (le carré avec une flèche vers le haut)."),
            el("li", null, "Choisis ", el("strong", { text: "Sur l'écran d'accueil" }), ", puis ", el("strong", { text: "Ajouter" }), "."))
        : el("ol", { class: "steps" },
            el("li", null, "Ouvre le menu du navigateur (", el("strong", { text: "⋮" }), ")."),
            el("li", null, "Choisis ", el("strong", { text: "Installer l'application" }), " ou ", el("strong", { text: "Ajouter à l'écran d'accueil" }), "."),
            el("li", null, "Confirme : Vigie apparaît avec tes autres apps.")));
      box.append(el("p", { class: "hint", text: "Vigie s'ouvre ensuite en plein écran, sans barre d'adresse, comme une app classique." }));
      return box;
    });
  }
  async function install() {
    hideInstall();
    if (!deferredPrompt) { openInstallHelp(); return; }
    const p = deferredPrompt; deferredPrompt = null;
    try { await p.prompt(); } catch (e) { openInstallHelp(); }
  }
  if (!IN_CLAUDE) {
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; maybeShowInstall(); });
    window.addEventListener("appinstalled", () => { deferredPrompt = null; hideInstall(); toast("Vigie est installée"); });
    $("#installGo").addEventListener("click", install);
    $("#installLater").addEventListener("click", () => { pref.set("installLater", Date.now() + 14 * 864e5); hideInstall(); });
    setTimeout(maybeShowInstall, 1500);
    const secure = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if ("serviceWorker" in navigator && secure) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => { /* hors ligne indisponible */ }); });
    }
  }

  // ---------- démarrage ----------
  buildDemo();
  refreshRates();
  render();
  setInterval(render, 30000);

  if (MODE === "claude") {
    (async () => {
      const db = await window.claude.use("db");
      if (!db) { render(); return; }
      state.db = db; state.backend = "claude";
      try { const user = await window.claude.use("user"); if (user) state.canWrite = await user.can("data.write"); } catch (e) { /* inconnu : on laisse essayer */ }
      db.collection("reports").orderBy("at", "desc").limit(400).onSnapshot((snap) => {
        state.live = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).filter(validLive);
        render();
      }, () => { state.backend = "local"; render(); toast("Synchronisation interrompue : tes signalements restent sur cet appareil."); });
      render();
    })();
  } else if (MODE === "supabase") {
    (async () => {
      try {
        await new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "__SUPABASE_JS__"; sc.onload = ok; sc.onerror = ko; document.head.append(sc); });
      } catch (e) { toast("Connexion impossible : vérifie ton réseau puis rouvre l'app."); return; }
      const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { persistSession: false, autoRefreshToken: false } });
      // colonne « direction » : absente tant que supabase/schema.sql n'a pas été relancé -> lecture sans le sens
      let cols = "id,kind,sub,of_kind,stop_id,line,direction,src,voter,at";
      const fromRow = (r) => ({ id: "sb" + r.id, kind: r.kind, sub: r.sub, of: r.of_kind, stopId: r.stop_id, line: r.line, dir: r.direction || null, src: r.src, by: r.voter || null, at: Date.parse(r.at) });
      state.sb = sb;
      const fetchRecent = () => sb.from("signalements").select(cols)
        .gte("at", new Date(Date.now() - 4 * 3600e3).toISOString()).order("at", { ascending: false }).limit(1000);
      state.pull = async () => {
        let { data, error } = await fetchRecent();
        if (error && cols.includes(",direction") && /direction|42703/i.test((error.code || "") + " " + (error.message || ""))) {
          cols = cols.replace(",direction", "");
          ({ data, error } = await fetchRecent());
        }
        if (error || !Array.isArray(data)) return false;
        state.live = data.map(fromRow).filter(validLive);
        state.backend = "supabase";
        render();
        return true;
      };
      if (!(await state.pull())) toast("Serveur injoignable pour l'instant : nouvel essai automatique.");
      sb.channel("signalements").on("postgres_changes", { event: "INSERT", schema: "public", table: "signalements" }, (p) => {
        const r = fromRow(p.new || {});
        if (validLive(r) && !state.live.some((x) => x.id === r.id)) { state.live.unshift(r); render(); }
      }).subscribe();
      // le temps réel peut se couper (veille du téléphone, 24 h max) : on resynchronise régulièrement
      setInterval(() => { if (!document.hidden) state.pull(); }, 120000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) state.pull(); });
      // vitesse des contrôles apprise par la base (table tendances, recalculée chaque heure)
      const loadTrends = async () => {
        const { data, error } = await sb.from("tendances").select("line,direction,paires,arrets,minutes");
        if (!error && Array.isArray(data)) { state.ratesRows = data; refreshRates(); render(); }
      };
      loadTrends();
      setInterval(() => { if (!document.hidden) loadTrends(); }, 30 * 60000);
    })();
  }
})();
</script>
