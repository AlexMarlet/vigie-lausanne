<title>Vigie Lausanne</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#173E62">
<meta name="description" content="Signalements en direct des contrôles et perturbations sur le réseau du Grand Lausanne.">
<!--@HEAD@-->
<style>
/*@LEAFLET_CSS@*/

/* Mise en page : carte plein écran ; bandeau de marque et filtres en haut ; dock d'action en bas ;
   une feuille coulissante pour signaler, lire un point, le fil Telegram et la légende. */
:root {
  --land: #E5E8E2; --land-edge: #C3CBC1; --lake: #B2CCDA; --lake-edge: #93B4C6;
  --ink: #14202A; --ink-2: #4E5D67; --ink-3: #7A8790;
  --surface: #FFFFFF; --surface-2: #F1F3EF; --hair: #D7DCD5;
  --accent: #173E62; --accent-ink: #FFFFFF; --accent-soft: #DDE7F0;
  --glass: rgba(255, 255, 255, .86);
  --shadow: 0 8px 28px rgba(14, 28, 38, .18), 0 1px 3px rgba(14, 28, 38, .14);
  --m1: /*@M1@*/; --m2: /*@M2@*/;
  --c-low: #F2C14E; --c-mid: #EE7B30; --c-high: #D7263D;
  --ok: #2B7656;
  --f-display: "Archivo", "Arial Narrow", Arial, system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --land: #11181D; --land-edge: #2A363E; --lake: #0E2939; --lake-edge: #1C4157;
    --ink: #E4ECF0; --ink-2: #9BABB5; --ink-3: #6F7F89;
    --surface: #1A242B; --surface-2: #222E36; --hair: #2E3A42;
    --accent: #8DBFEA; --accent-ink: #0A1A27; --accent-soft: #1E3346;
    --glass: rgba(26, 36, 43, .88);
    --shadow: 0 8px 28px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
    --ok: #6FC49B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --land: #11181D; --land-edge: #2A363E; --lake: #0E2939; --lake-edge: #1C4157;
  --ink: #E4ECF0; --ink-2: #9BABB5; --ink-3: #6F7F89;
  --surface: #1A242B; --surface-2: #222E36; --hair: #2E3A42;
  --accent: #8DBFEA; --accent-ink: #0A1A27; --accent-soft: #1E3346;
  --glass: rgba(26, 36, 43, .88);
  --shadow: 0 8px 28px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
  --ok: #6FC49B;
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--land); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { position: relative; height: 100%; overflow: hidden; }
.map { position: absolute; inset: 0; background: var(--land); z-index: 0; }
.leaflet-container { background: var(--land); font-family: var(--f-body); }

/* calque d'interface, avec la marge latérale */
.ui { position: absolute; inset: 0; z-index: 1; pointer-events: none; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
      display: flex; flex-direction: column; padding-block: 10px 14px; }
.ui > * { pointer-events: auto; }
.ui > .spacer { pointer-events: none; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
          background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
          border: 1px solid var(--hair); border-radius: 16px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow); }
.brand { display: flex; flex-direction: column; min-width: 0; }
.wordmark { font-family: var(--f-display); font-weight: 850; font-stretch: 118%; font-size: 21px; letter-spacing: .08em; line-height: 1; }
.wordmark b { color: var(--c-high); font-weight: inherit; }
.status { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); flex: none; }
.live.off { background: var(--ink-3); box-shadow: none; }
.pill-btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--hair); background: var(--surface); border-radius: 12px; padding: 9px 12px; font-family: var(--f-display); font-weight: 650; font-size: 14px; }
.pill-btn svg { width: 18px; height: 18px; }
.count { min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }

.filters { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--hair); background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        border-radius: 999px; padding: 7px 10px; font-size: 13.5px; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip[aria-pressed="false"] { color: var(--ink-2); }
.chip.demo[aria-pressed="true"] { background: var(--c-low); color: #2B2100; }
.shape { width: 11px; height: 11px; display: inline-block; background: currentColor; flex: none; }
.shape.circle { border-radius: 50%; }
.shape.diamond { transform: rotate(45deg) scale(.85); border-radius: 2px; }

.spacer { flex: 1; }
.toast { align-self: center; margin-bottom: 10px; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); max-width: 100%; }
.dock { display: flex; align-items: center; justify-content: center; gap: 12px; }
.install { align-self: center; width: 100%; max-width: 460px; box-sizing: border-box; display: flex; align-items: center; gap: 10px;
           margin-bottom: 10px; background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 10px 6px 10px 10px; box-shadow: var(--shadow); }
.install-logo { width: 40px; height: 40px; flex: none; }
.install-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.install-text strong { font-family: var(--f-display); font-weight: 800; font-size: 15px; }
.install-text span { color: var(--ink-2); font-size: 13px; }
.install .go { border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 9px 12px; flex: none; }
.install .later { border: 0; background: none; color: var(--ink-3); font-size: 22px; line-height: 1; width: 36px; height: 36px; flex: none; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
.links { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; padding-top: 4px; border-top: 1px solid var(--hair); }
.links a, .links .link { color: var(--accent); font-weight: 700; padding: 8px 0; }
.round { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 1px solid var(--hair); background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
.round svg { width: 22px; height: 22px; }
.fab { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 56px; padding: 0 26px; min-width: 0; flex: 0 1 220px;
       border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow);
       font-family: var(--f-display); font-weight: 800; font-stretch: 108%; font-size: 17px; letter-spacing: .02em; }
.fab svg { width: 22px; height: 22px; flex: none; }

/* feuille coulissante */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 74%; display: flex; flex-direction: column;
         background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(10, 20, 28, .22);
         transform: translateY(0); transition: transform .26s cubic-bezier(.2, .8, .2, 1); z-index: 2; }
.sheet.closing { transform: translateY(105%); }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--hair); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px var(--gutter-r) 4px var(--gutter-l); flex: none; }
.sheet-head h2:focus { outline: none; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-stretch: 105%; font-size: 20px; text-wrap: balance; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 22px; line-height: 1; flex: none; }
.sheet-body { overflow-y: auto; padding: 6px var(--gutter-r) 22px var(--gutter-l); overscroll-behavior: contain; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack > p.facts, .stack > p.note { margin: 0; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.label + * { margin-top: 0; }

.label { font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg button { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; border: 2px solid var(--hair); background: var(--surface); text-align: left; font-weight: 700; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.seg .shape { width: 14px; height: 14px; color: var(--c-mid); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1.5px solid var(--hair); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: 14px; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.field { width: 100%; box-sizing: border-box; border: 1.5px solid var(--hair); background: var(--surface-2); color: var(--ink); border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; }
.field:focus { border-color: var(--accent); outline: none; }
.sugg { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.sugg button { display: flex; align-items: center; gap: 8px; justify-content: space-between; border: 0; background: transparent; padding: 10px 8px; border-radius: 10px; text-align: left; }
.sugg button:hover, .sugg button:focus-visible { background: var(--surface-2); }
.picked { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px solid var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; }
.picked strong { font-family: var(--f-display); font-size: 17px; font-weight: 750; }
.link { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 6px; text-decoration: underline; text-underline-offset: 3px; }
.hint { color: var(--ink-2); font-size: 13.5px; margin: 6px 0 0; }
.primary { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: .02em; }
.primary:disabled { opacity: .45; cursor: not-allowed; }
.secondary { height: 48px; border-radius: 14px; border: 1.5px solid var(--hair); background: var(--surface); font-weight: 700; flex: 1; }
.row { display: flex; gap: 10px; align-items: center; }
.num { width: 86px; flex: none; text-align: center; font-variant-numeric: tabular-nums; }
.privacy { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-2); font-size: 13px; }
.privacy svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

.badge { display: inline-block; min-width: 2.1em; box-sizing: border-box; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 11.5px; line-height: 1; padding: 4px 6px; border-radius: 5px; background: var(--ink); color: var(--surface); font-variant-numeric: tabular-nums; }
.badge.M1 { background: var(--m1); color: #fff; }
.badge.M2 { background: var(--m2); color: #fff; }
.badges { display: inline-flex; gap: 4px; flex-wrap: wrap; }

/* fiche d'un point */
.k-head { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-weight: 700; font-size: 13.5px; }
.k-stop { font-family: var(--f-display); font-weight: 850; font-stretch: 110%; font-size: 28px; line-height: 1.05; margin: 4px 0 6px; text-wrap: balance; }
.conf { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 4px 14px; }
.conf-level { font-family: var(--f-display); font-weight: 850; font-size: 30px; line-height: 1; text-transform: capitalize; }
.conf-pct { color: var(--ink-2); font-size: 14px; padding-bottom: 3px; font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; position: relative; height: 10px; border-radius: 10px; background: linear-gradient(90deg, var(--c-low), var(--c-mid) 50%, var(--c-high)); margin-top: 8px; }
.bar i { position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 3px; background: var(--ink); transform: translateX(-2px); box-shadow: 0 0 0 2px var(--surface); }
.bar-scale { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); }
.facts { color: var(--ink-2); font-size: 14px; }
.facts strong { color: var(--ink); }
.cleared { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tl li { display: grid; grid-template-columns: 74px 1fr 56px; align-items: center; gap: 10px; font-size: 13.5px; }
.tl .t { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tl .w { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.tl .w i { display: block; height: 100%; border-radius: 6px; background: var(--c-mid); }
.note { color: var(--ink-3); font-size: 12.5px; }

/* fil Telegram */
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.feed li { padding: 11px 0; border-top: 1px solid var(--hair); display: grid; gap: 6px; }
.feed li:first-child { border-top: 0; }
.msg { font-family: var(--f-mono); font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 3px 7px; background: var(--surface-2); font-weight: 700; color: var(--ink); }
.tag.miss { color: var(--ink-3); font-weight: 400; font-style: italic; }
.feed li.dim .msg { color: var(--ink-3); }
.tester { background: var(--surface-2); border-radius: 14px; padding: 12px; }
.tester .field { background: var(--surface); }
.tester .meta { margin-top: 8px; min-height: 22px; }

/* légende */
.leg { display: grid; grid-template-columns: 56px 1fr; gap: 12px 14px; align-items: center; }
.leg p { margin: 0; }
.ramp { display: flex; align-items: flex-end; gap: 16px; padding: 6px 0; }
.ramp figure { margin: 0; display: grid; justify-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.rules { margin: 0; padding-left: 18px; color: var(--ink-2); }
.rules li + li { margin-top: 4px; }
.rules strong { color: var(--ink); }
.trend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.trend li { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.trend .n { margin-left: auto; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.est { display: flex; flex-direction: column; gap: 4px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
.est strong { font-family: var(--f-display); font-size: 30px; font-weight: 850; line-height: 1; }

/* carte : fond, lignes, arrêts, points */
.lake { fill: var(--lake); fill-opacity: 1; stroke: var(--lake-edge); stroke-width: 1; }
.commune { fill: none; stroke: var(--land-edge); stroke-width: 1.2; stroke-dasharray: 2 5; stroke-linecap: round; }
.casing { stroke: var(--land); stroke-width: 10; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.line-M1 { stroke: var(--m1); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.line-M2 { stroke: var(--m2); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.stop-metro { fill: var(--surface); stroke: var(--ink); stroke-width: 2.2; }
.stop-bus { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.6; }
.stop-picked { fill: var(--accent); stroke: var(--surface); stroke-width: 3; }
.zlt135 .stop-bus:not(.stop-major) { display: none; }

/* position estimée : trajet probable et arrêts de la zone la plus probable */
.trail-base { fill: none; stroke: var(--c-high); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
.trail { fill: none; stroke: var(--c-high); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.5 9; }
.gh-wrap { background: none; border: 0; }
.gh { width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; border: 2.5px dashed var(--col);
      background: color-mix(in srgb, var(--col) 18%, transparent); }
.leaflet-tooltip.lbl { background: transparent; border: 0; box-shadow: none; padding: 0 0 0 1px; margin-left: 4px;
  font-family: var(--f-display); font-weight: 650; font-stretch: 92%; font-size: 11.5px; color: var(--ink); white-space: nowrap;
  text-shadow: 0 0 2px var(--land), 0 0 3px var(--land), 0 0 5px var(--land); }
.leaflet-tooltip.lbl::before { display: none; }
.leaflet-tooltip.lbl-bus { color: var(--ink-2); font-weight: 600; }
.commune-lbl { font-family: var(--f-display); font-weight: 700; font-stretch: 112%; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); white-space: nowrap; transform: translate(-50%, -50%); width: max-content; pointer-events: none;
  text-shadow: 0 0 3px var(--land), 0 0 6px var(--land); }
.zlt14 .lbl-metro:not(.lbl-major), .zlt15 .lbl-bus:not(.lbl-major), .zlt125 .lbl-major, .zge13 .commune-lbl { display: none; }
.leaflet-tooltip.lbl-major { font-weight: 750; }

.mk-wrap { background: none; border: 0; }
.mk { position: relative; width: 100%; height: 100%; }
.mk .core { position: absolute; inset: 0; display: grid; place-items: center; background: var(--col); border: 2.5px solid var(--surface);
  border-radius: 50%; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); font-family: var(--f-display); font-weight: 850; font-size: 13px; color: var(--txt); }
.mk.p .core { border-radius: 5px; transform: rotate(45deg) scale(.8); }
.mk.p .core span { transform: rotate(-45deg); }
.mk .halo { position: absolute; inset: -7px; border-radius: 50%; border: 2.5px solid var(--col); opacity: 0; }
.mk.fresh .halo { animation: pulse 1.9s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.45); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .mk.fresh .halo { animation: none; opacity: .6; }
  .sheet { transition: none; }
}
.leaflet-control-attribution { font-size: 10px; background: var(--glass) !important; color: var(--ink-2); }
.leaflet-control-attribution a { color: var(--ink-2); }
</style>

<div class="app">
  <div id="map" class="map" role="application" aria-label="Carte du Grand Lausanne avec les signalements"></div>

  <div class="ui">
    <header class="topbar">
      <div class="brand">
        <span class="wordmark">VIGIE<b>.</b></span>
        <span class="status"><span id="liveDot" class="live off"></span><span id="status">Grand Lausanne</span></span>
      </div>
      <button id="btnFeed" class="pill-btn" type="button" aria-label="Ouvrir le fil des signalements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4 3 11l6 2.5L18 7l-7 8 7 5z"/></svg>
        <span>Fil</span><span id="feedCount" class="count">0</span>
      </button>
    </header>

    <nav class="filters" aria-label="Filtres">
      <button class="chip" type="button" data-filter="controle" aria-pressed="true"><i class="shape circle"></i>Contrôles</button>
      <button class="chip" type="button" data-filter="perturbation" aria-pressed="true"><i class="shape diamond"></i>Perturbations</button>
      <button class="chip" type="button" data-filter="estimation" aria-pressed="true"><i class="shape circle" style="background:none;border:2px dashed currentColor;box-sizing:border-box"></i>Estimations</button>
      <button class="chip demo" type="button" id="chipDemo" aria-pressed="true">Démo</button>
    </nav>

    <div class="spacer"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="install" class="install" hidden>
      <svg class="install-logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#173E62"/><path d="M118 146h92l50 172 50-172h92l-96 238h-92z" fill="#fff"/><circle cx="402" cy="352" r="34" fill="#D7263D"/></svg>
      <div class="install-text"><strong>Installer Vigie</strong><span>Sur ton écran d'accueil, comme une app.</span></div>
      <button id="installGo" class="go" type="button">Installer</button>
      <button id="installLater" class="later" type="button" aria-label="Plus tard">×</button>
    </div>

    <div class="dock">
      <button id="btnLegend" class="round" type="button" aria-label="Légende et fonctionnement">

        Signaler

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>

  <section id="sheet" class="sheet" role="dialog" aria-labelledby="sheetTitle" hidden>

  </section>
</div>
